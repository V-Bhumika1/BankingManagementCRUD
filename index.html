
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Bank Management System</h1>
            <p>Manage customer bank accounts</p>
        </div>
    </header>

    <main class="container">
        <section class="summary">
            <div class="summary-card">
                <h3>Total Accounts</h3>
                <p id="totalAccounts">0</p>
            </div>
            <div class="summary-card">
                <h3>Total Balance</h3>
                <p id="totalBalance">₹0.00</p>
            </div>
        </section>

        <section class="panel">
            <h2 id="formTitle">Add New Account</h2>

            <form id="accountForm">
                <input type="hidden" id="editId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="accountNumber">Account Number</label>
                        <input type="text" id="accountNumber"
                               placeholder="e.g. 10001"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="customerName">Customer Name</label>
                        <input type="text" id="customerName"
                               placeholder="Enter full name"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email"
                               placeholder="customer@example.com"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone"
                               placeholder="10-digit phone number"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="accountType">Account Type</label>
                        <select id="accountType" required>
                            <option value="">Select account type</option>
                            <option value="Savings">Savings</option>
                            <option value="Current">Current</option>
                            <option value="Fixed Deposit">Fixed Deposit</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="balance">Balance (₹)</label>
                        <input type="number" id="balance"
                               min="0" step="0.01"
                               placeholder="Enter balance"
                               required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn"
                            class="btn btn-primary">
                        Add Account
                    </button>
                    <button type="button" id="cancelBtn"
                            class="btn btn-secondary"
                            hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="table-heading">
                <h2>Account Records</h2>
                <input type="search" id="searchInput"
                       placeholder="Search by name or account number">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Account No.</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Type</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accountTable">
                        <!-- Records added through JavaScript -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage" class="empty-message">
                No accounts found. Add your first account above.
            </p>
        </section>
    </main>

    <footer>
        <p>Bank Management System | CRUD Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
